<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JIECEP-IBC Verifier</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: linear-gradient(135deg, #179bc4 0%, #5829b5 100%);
      --bg: #1e1e1e;
      --border: #333333;
    }
    body { font-family: 'Inter', sans-serif; margin: 0; padding: 15px; background: transparent; color: white; display: flex; justify-content: center; }
    .container { background: var(--bg); border-radius: 20px; padding: 25px; max-width: 400px; width: 100%; border: 1px solid var(--border); box-sizing: border-box; }
    .logo-box { width: 50px; height: 50px; background: var(--primary); margin: 0 auto 12px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 700; }
    h2 { margin: 0; font-size: 18px; text-align: center; margin-bottom: 20px; }
    
    /* Sleek Auto-fill Notification */
    #auto-hint { 
      display: none; 
      background: rgba(23, 155, 196, 0.1); 
      border: 1px solid #179bc4; 
      padding: 10px; 
      border-radius: 8px; 
      margin-bottom: 15px; 
      font-size: 12px; 
      text-align: center;
      cursor: pointer;
    }

    input { width: 100%; padding: 12px; background: #2a2a2a; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; color: white; box-sizing: border-box; margin-bottom: 12px; }
    button { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; }
    #result { margin-top: 20px; display: none; background: #252525; padding: 15px; border-radius: 12px; border: 1px solid var(--border); }
    .data-row { margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 6px; }
    .label { color: #666; font-size: 9px; text-transform: uppercase; display: block; }
    .val { font-size: 13px; }
  </style>
</head>
<body>
<div class="container">
  <div class="logo-box">IBC</div>
  <h2>JIECEP-IBC Verifier</h2>
  
  <div id="auto-hint" onclick="manualTrigger()">
    ✨ <b>Scan Detected!</b> Tap here to auto-fill ID.
  </div>

  <input type="text" id="memberID" placeholder="Enter ID (e.g. IBC-26-001)">
  <button onclick="checkID()">Verify Member</button>
  <div id="result"></div>
</div>

<script>
  // YOUR FIREBASE CONFIG
  const firebaseConfig = {
    apiKey: "AIzaSyCP9IubRBz_OhCAD1eSdLTjea6GvfSwMps",
    authDomain: "jiecep-ibc-registry.firebaseapp.com",
    databaseURL: "https://jiecep-ibc-registry-default-rtdb.firebaseio.com",
    projectId: "jiecep-ibc-registry",
    appId: "1:814485997647:web:4b688a43ed42635875c23a"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let detectedID = "";

  function checkID(providedID) {
    const id = providedID || document.getElementById('memberID').value.trim().toUpperCase();
    if(!id) return;
    db.ref('members/' + id).once('value', (snapshot) => {
      const res = document.getElementById('result');
      res.style.display = "block";
      if (snapshot.exists()) {
        const d = snapshot.val();
        let html = `<div>`;
        for (let k in d) {
          let lab = k.replace(/([A-Z])/g, ' $1').toUpperCase();
          html += `<div class="data-row"><span class="label">${lab}</span><span class="val">${d[k]}</span></div>`;
        }
        res.innerHTML = html + `</div>`;
      } else {
        res.innerHTML = `<div style="color:#fc8181;">Record not found.</div>`;
      }
    });
  }

  function manualTrigger() {
    if(detectedID) {
      document.getElementById('memberID').value = detectedID;
      checkID(detectedID);
      document.getElementById('auto-hint').style.display = "none";
    }
  }

  window.onload = function() {
    // Attempt to grab from URL
    const params = new URLSearchParams(window.location.search);
    detectedID = params.get('id');

    if (detectedID) {
      document.getElementById('auto-hint').style.display = "block";
    }
  };
</script>
</body>
</html>
