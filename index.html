<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verification | JIECEP-IBC</title>
  
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: linear-gradient(135deg, #179bc4 0%, #5829b5 100%);
      --bg-dark: #0f0f0f;
      --card-bg: #1a1a1a;
      --nav-bg: rgba(20, 20, 20, 0.95);
      --border: #2d2d2d;
      --text: #ffffff;
      --accent: #179bc4;
    }

    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--bg-dark);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Navbar */
    .nav-bar {
      width: 100%;
      height: 64px;
      background: var(--nav-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5%;
      box-sizing: border-box;
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(12px);
    }

    .nav-brand {
      font-weight: 700;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-dot { height: 10px; width: 10px; background: var(--primary); border-radius: 50%; }

    .nav-links a {
      color: var(--text);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      margin-left: 20px;
      opacity: 0.7;
      text-transform: uppercase;
      transition: opacity 0.3s ease;
    }

    .nav-links a:hover { opacity: 1; }

    /* Layout */
    .content-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: radial-gradient(circle at top right, #1a1a1a, #0f0f0f);
    }

    .container {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 40px 30px;
      max-width: 500px;
      width: 100%;
      border: 1px solid var(--border);
      box-sizing: border-box; /* Ensures padding doesn't push the card out */
    }

    .header-icon {
      width: 60px; height: 60px;
      background: var(--primary);
      margin: 0 auto 20px;
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: 800; font-size: 20px;
    }

    h2 { margin: 0; font-size: 24px; font-weight: 700; text-align: center; letter-spacing: -0.8px; }
    .instructions { color: #888; font-size: 13px; margin: 10px 0 25px; text-align: center; line-height: 1.6; }

    /* Inputs & Buttons - Fixed Layout */
    input {
      width: 100%;
      padding: 16px;
      background: #252525;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 15px;
      color: white;
      box-sizing: border-box; /* CRITICAL FIX: Keeps input inside container */
      margin-bottom: 15px;
      font-family: 'Inter';
      text-align: center;
      display: block;
    }

    button {
      width: 100%;
      padding: 16px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-sizing: border-box; /* CRITICAL FIX: Keeps button inside container */
      transition: transform 0.2s ease;
    }

    button:active { transform: scale(0.98); }

    /* Results Card */
    #result { margin-top: 35px; display: none; animation: fadeIn 0.4s ease forwards; }
    .result-card { background: #111; border-radius: 18px; padding: 25px; border: 1px solid #333; }
    .status-header { border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 20px; text-align: center; }
    .status-badge { color: #00b894; font-weight: 700; font-size: 11px; letter-spacing: 2px; }

    .data-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; gap: 15px; }
    .label { color: #666; font-size: 10px; text-transform: uppercase; font-weight: 700; min-width: 100px; }
    .val { color: #eee; font-size: 14px; font-weight: 500; text-align: right; word-break: break-word; }

    .admin-btn {
      margin-top: 20px; width: 100%;
      background: transparent; border: 1px solid #444;
      color: #888; font-size: 11px; padding: 10px;
      border-radius: 8px; cursor: pointer;
    }

    footer { padding: 25px; text-align: center; font-size: 11px; color: #444; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 480px) {
      .data-row { flex-direction: column; gap: 4px; align-items: flex-start; }
      .val { text-align: left; }
    }
  </style>
</head>
<body>

  <nav class="nav-bar">
    <div class="nav-brand"><div class="brand-dot"></div> JIECEP-IBC</div>
    <div class="nav-links">
      <a href="https://sites.google.com/view/jiecep-ibc/home">HOME</a>
      <a href="https://sites.google.com/view/jiecep-ibc/verify">RE-SCAN</a>
    </div>
  </nav>

  <div class="content-area">
    <div class="container">
      <div class="header-icon">IBC</div>
      <h2>Verify Membership</h2>
      <p class="instructions">Official 2026 Registry Access</p>
      
      <input type="text" id="memberID" placeholder="IBC-26-XXXX">
      <button onclick="checkID()">Check Registry</button>
      
      <div id="result"></div>
    </div>
  </div>

  <footer>&copy; 2026 JIECEP - Iligan Bay Chapter</footer>

<script>
  // Firebase Configuration
  const firebaseConfig = {
    apiKey: "AIzaSyCP9IubRBz_OhCAD1eSdLTjea6GvfSwMps",
    authDomain: "jiecep-ibc-registry.firebaseapp.com",
    databaseURL: "https://jiecep-ibc-registry-default-rtdb.firebaseio.com",
    projectId: "jiecep-ibc-registry",
    appId: "1:814485997647:web:4b688a43ed42635875c23a"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // Admin Setup
  const ADMIN_PASS = "IBC_ADMIN_2026"; 
  const PUBLIC_FIELDS = ["fullName", "status", "membershipStatus"];

  function checkID() {
    const id = document.getElementById('memberID').value.trim().toUpperCase();
    if(!id) return;
    
    db.ref('members/' + id).once('value', (snapshot) => {
      const res = document.getElementById('result');
      res.style.display = "block";
      if (snapshot.exists()) {
        renderProfile(snapshot.val(), false);
      } else {
        res.innerHTML = `<div style="color:#fc8181; font-size:13px; text-align:center; padding:15px; background:rgba(252,129,129,0.1); border-radius:12px;">No records found for "${id}".</div>`;
      }
    });
  }

  function renderProfile(data, isAdmin) {
    const res = document.getElementById('result');
    let html = `<div class="result-card">
                  <div class="status-header">
                    <span class="status-badge">● VERIFIED ACTIVE MEMBER</span>
                  </div>`;
    
    for (let k in data) {
      // Privacy logic: Show only name and status unless admin access is granted
      if (!isAdmin && !PUBLIC_FIELDS.includes(k)) continue;

      let lab = k.replace(/([A-Z])/g, ' $1').toUpperCase();
      html += `<div class="data-row">
                 <span class="label">${lab}</span>
                 <span class="val">${data[k]}</span>
               </div>`;
    }

    if (!isAdmin) {
      html += `<button class="admin-btn" onclick="requestAdminAccess()">ADMIN: VIEW FULL PROFILE</button>`;
    }

    res.innerHTML = html + `</div>`;
  }

  function requestAdminAccess() {
    const pass = prompt("Enter Admin Keypass to view sensitive member data:");
    if (pass === ADMIN_PASS) {
      const id = document.getElementById('memberID').value.trim().toUpperCase();
      db.ref('members/' + id).once('value', (snapshot) => {
        renderProfile(snapshot.val(), true);
      });
    } else if (pass !== null) {
      alert("Unauthorized access denied.");
    }
  }

  window.onload = function() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    if (id) {
      document.getElementById('memberID').value = id.toUpperCase();
      setTimeout(checkID, 800);
    }
  };
</script>
</body>
</html>
